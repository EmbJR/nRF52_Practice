# Project Configuration for nRF52832 with LED and UART

# Enable GPIO support
CONFIG_GPIO=y

# Enable UART support
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Set log level
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable threading
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# Heap configuration
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Enable printk for easier debugging
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE_ON_DEV_NAME="UART_0"
